name: Fix runtimeAction typing

on:
  push:
    paths:
      - '.github/workflows/fix-runtime-action.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add explicit AssistantAction annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          old = "        const runtimeAction = createdEventCount === 1\n"
          new = "        const runtimeAction: AssistantAction = createdEventCount === 1\n"
          if old not in text:
              raise SystemExit('Target line not found; refusing to modify anything else.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Fix runtimeAction TypeScript inference"
          git push origin HEAD:main
