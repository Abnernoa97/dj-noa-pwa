name: Build Check

on:
  push:
    branches: [main, audit-hardening, data-protection, performance-coherence, ai-deterministic, notifications-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:ai
      - run: npm run build
      - run: npx wrangler deploy --dry-run
